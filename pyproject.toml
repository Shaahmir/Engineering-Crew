[project]
name = "engineering_crew"
version = "0.1.0"
description = "engineering_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.22,<2.0.0",
    "dotenv>=0.9.9",
]

[project.scripts]
engineering_crew = "engineering_crew.main:run"
run_crew = "engineering_crew.main:run"
train = "engineering_crew.main:train"
replay = "engineering_crew.main:replay"
test = "engineering_crew.main:test"
run_with_trigger = "engineering_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "669db9e0-093c-433c-ae34-c00a293cb7db"
